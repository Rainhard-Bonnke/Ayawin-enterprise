services:
  - type: web
    name: ayawin-api
    runtime: node
    plan: starter
    buildCommand: cd backend && npm ci
    preDeployCommand: cd backend && npm run db:migrate
    startCommand: cd backend && npm start
    healthCheckPath: /ready
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "4000"
      - key: APP_BASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ayawin-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ayawin-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY_VERSION
        value: "1"
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: DOC_VERIFY_SECRET
        sync: false

  - type: web
    name: ayawin-frontend
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: node .output/server/index.mjs
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: VITE_API_BASE
        sync: false

  - type: worker
    name: ayawin-etims-worker
    runtime: node
    plan: starter
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm run worker:etims
    numInstances: 2
    restartPolicyType: on-failure
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ayawin-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: ayawin-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY_VERSION
        value: "1"
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: DOC_VERIFY_SECRET
        sync: false

  - type: worker
    name: ayawin-mpesa-worker
    runtime: node
    plan: starter
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm run worker:mpesa
    numInstances: 2
    restartPolicyType: on-failure
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ayawin-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: ayawin-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: INTEGRATION_ENCRYPTION_KEY
        sync: false
      - key: INTEGRATION_ENCRYPTION_KEY_VERSION
        value: "1"
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: DOC_VERIFY_SECRET
        sync: false

  - type: worker
    name: ayawin-notification-worker
    runtime: node
    plan: starter
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm run worker:notifications
    numInstances: 2
    restartPolicyType: on-failure
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ayawin-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: ayawin-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"
      - key: MFA_ENCRYPTION_KEY
        sync: false
      - key: PII_ENCRYPTION_KEY
        sync: false
      - key: DOC_VERIFY_SECRET
        sync: false

  - type: worker
    name: ayawin-report-worker
    runtime: node
    plan: starter
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm run worker:reports
    numInstances: 1
    restartPolicyType: on-failure
    envVars:
      - key: NODE_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: ayawin-redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: ayawin-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

  - type: worker
    name: ayawin-hr-compliance-worker
    runtime: node
    plan: starter
    buildCommand: cd backend && npm ci
    startCommand: cd backend && npm run worker:hr
    numInstances: 1
    restartPolicyType: on-failure
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ayawin-db
          property: connectionString
      - key: DATABASE_SSL
        value: "true"

  - type: keyvalue
    name: ayawin-redis
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

databases:
  - name: ayawin-db
    plan: standard
    databaseName: ayawin_enterprise
    user: ayawin
    postgresMajorVersion: "16"
    diskSizeGB: 50
