name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  verify:
    name: Backend tests, e2e, and lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ayawin_enterprise
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ayawin_enterprise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_HOST: localhost
      DATABASE_PORT: 5432
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      DATABASE_DB: ayawin_enterprise
      NODE_ENV: test
      JWT_SECRET: ci-jwt-secret-for-automated-tests-32-chars-minimum
      DOC_VERIFY_SECRET: ci-document-verification-secret-32-chars-minimum
      MFA_ENCRYPTION_KEY: ci-mfa-key-is-independent-and-long-enough-32
      ADMIN_EMAIL: admin@example.test
      ADMIN_PASSWORD: ci-test-admin-password
      VERIFY_CLEAN_MIGRATIONS: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci

      - name: Run backend unit tests
        run: npm test
        working-directory: backend

      - name: Run all backend e2e tests
        run: npm run test:e2e
        working-directory: backend

      - name: Lint
        run: npm run lint
